<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Gemma Pi Local</title>
  <desc id="description">Multimodal local Gemma on Raspberry Pi and Apple silicon with model-initiated web search.</desc>
  <rect width="1280" height="640" fill="#f1eee5"/>
  <rect width="682" height="640" fill="#111410"/>
