name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m compileall -q app scripts/probe-tool-call.py scripts/probe-agent-search.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: bash -n install.sh install-macos.sh start.sh bin/gemma-pi scripts/doctor.sh scripts/smoke-test.sh scripts/searxng.sh scripts/pi-search-gate.sh
      - name: Check browser JavaScript syntax
        run: node --check static/app.js
