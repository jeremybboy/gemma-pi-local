name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG}" = "v$(tr -d '[:space:]' < VERSION)"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "${notes_file}" ]]; then
            gh release create "${RELEASE_TAG}" --verify-tag --title "Gemma Pi Local ${RELEASE_TAG}" --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" --verify-tag --title "Gemma Pi Local ${RELEASE_TAG}" --generate-notes
          fi
